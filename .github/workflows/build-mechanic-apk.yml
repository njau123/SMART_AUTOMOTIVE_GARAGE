name: Build Mechanic App APK

on:
  push:
    branches: [main]
    paths:
      - 'mechanic_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: cd mechanic_app && flutter pub get

      - name: Build APK
        run: cd mechanic_app && flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mechanic-app-release-apk
          path: mechanic_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
