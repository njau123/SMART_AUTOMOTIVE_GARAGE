services:
  - type: web
    name: smart-garage-backend
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python create_superuser.py
    startCommand: gunicorn automotive_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: smart-garage-backend.onrender.com,localhost,127.0.0.1
      - key: FIREBASE_PROJECT_ID
        value: smart-automotive-garage
      - key: FIREBASE_STORAGE_BUCKET
        value: smart-automotive-garage.appspot.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-garage-user.vercel.app,https://smart-garage-mechanic.vercel.app,https://smart-garage-admin.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://smart-garage-backend.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        value: njau
      - key: DJANGO_SUPERUSER_EMAIL
        value: njaufredrick0@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false          # utaiweka kwa mkono kwenye dashboard
      - key: DATABASE_URL
        sync: false          # utaiweka kwa mkono kwenye dashboard
      - key: FIREBASE_CREDENTIALS_B64
        sync: false          # utaiweka kwa mkono kwenye dashboard
